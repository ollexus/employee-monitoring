<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мониторинг рабочей активности</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f7be0'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M11 18l3-4 3 3 3-5' fill='none' stroke='%237ff08a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
            <h1 id="pageTitle">Мониторинг рабочей активности</h1>
            <p class="subtitle" id="serverInfo">сервер: —</p>
        </div>
    </div>

    <div class="controls">
        <span class="link-state" id="linkState" title="Соединение с сервером">
            <span class="dot" id="linkDot"></span>
            <span id="linkText">подключение…</span>
        </span>
        <input type="search" id="searchBox" placeholder="Поиск: компьютер, пользователь, IP" autocomplete="off" />
        <label class="switch" title="Показывать только активных сотрудников">
            <input type="checkbox" id="onlyActive" />
            <span>только активные</span>
        </label>
        <label class="switch">
            <input type="checkbox" id="autoRefresh" checked />
            <span>автообновление</span>
        </label>
        <select id="refreshInterval" title="Интервал обновления">
            <option value="2000">2 с</option>
            <option value="5000" selected>5 с</option>
            <option value="10000">10 с</option>
            <option value="30000">30 с</option>
        </select>
        <button class="ghost" id="refreshNow" title="Обновить сейчас">Обновить</button>
    </div>
</header>

<section class="stats">
    <article class="card">
        <span class="card-label">В сети</span>
        <strong class="card-value" id="statOnline">0</strong>
    </article>
    <article class="card">
        <span class="card-label">Всего агентов</span>
        <strong class="card-value" id="statTotal">0</strong>
    </article>
    <article class="card">
        <span class="card-label">Активны (бездействие &lt; 5 мин)</span>
        <strong class="card-value" id="statActive">0</strong>
    </article>
    <article class="card">
        <span class="card-label">Со снимками</span>
        <strong class="card-value" id="statShots">0</strong>
    </article>
</section>

<main>
    <table class="clients">
        <thead>
        <tr>
            <th class="col-status">Состояние</th>
            <th>Компьютер</th>
            <th>Домен</th>
            <th>Пользователь</th>
            <th>IP-адрес</th>
            <th>Текущая активность</th>
            <th>Ресурсы</th>
            <th>Последняя активность</th>
            <th class="col-shot">Снимок экрана</th>
            <th class="col-actions">Действия</th>
        </tr>
        </thead>
        <tbody id="clientRows"></tbody>
    </table>

    <p class="empty" id="emptyState" hidden>Агенты не подключены.</p>
</main>

<div class="modal" id="screenshotModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-window" role="dialog" aria-modal="true" aria-label="Снимок экрана">
        <header>
            <h2 id="modalTitle">Снимок экрана</h2>
            <button class="ghost" data-close="true" aria-label="Закрыть">✕</button>
        </header>
        <div class="modal-body">
            <img id="modalImage" alt="Снимок экрана сотрудника" />
            <dl class="details" id="modalDetails"></dl>
        </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
